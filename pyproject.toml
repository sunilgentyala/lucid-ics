[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-ics"
version = "0.1.0"
description = "LUCID-ICS: an explainable ML + LLM triage framework for ICS/SCADA intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunil Gentyala" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30", "openai>=1.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
lucid-ics = "lucid_ics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
